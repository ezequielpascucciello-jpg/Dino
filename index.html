<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dino Aventura</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 30%,#2a1d12,#0e0905);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Lilita One',system-ui,sans-serif;color:#fff}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;box-shadow:0 12px 50px rgba(0,0,0,.7);border-radius:14px}
canvas{display:block;width:100%;height:100%;border-radius:14px}
#overlay{position:absolute;inset:0;display:flex;overflow-y:auto;background:rgba(10,7,4,.66);border-radius:14px;padding:14px;box-sizing:border-box;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#overlay.hidden{display:none}
.touch #overlay{position:fixed;inset:0;border-radius:0;z-index:10;background:rgba(10,7,4,.88);padding:16px 14px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.panel{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;max-width:640px;width:100%}
.panel>div{display:contents}
h1{font-size:clamp(28px,7vw,60px);margin:0;color:#ffd23f;text-shadow:0 4px 0 #a0430a,0 8px 20px rgba(0,0,0,.5);line-height:1}
h2{font-size:clamp(22px,5vw,40px);margin:0;color:#ffd23f;text-shadow:0 3px 0 #a0430a}
p{margin:3px 0;font-size:clamp(12px,2.4vw,17px);opacity:.93;font-family:system-ui,sans-serif;font-weight:600}
.big{font-size:clamp(15px,3.2vw,24px);font-family:'Lilita One',system-ui,sans-serif;font-weight:400}
.small{font-size:clamp(11px,2vw,14px);opacity:.8}
.err{color:#ff8a8a}
.tag{background:rgba(255,255,255,.12);border-radius:8px;padding:2px 10px}
.btn{font:inherit;font-size:clamp(16px,3vw,22px);padding:9px 24px;border:none;border-radius:14px;background:#7ac943;color:#173b06;box-shadow:0 5px 0 #3f7a1a;cursor:pointer;margin:6px 4px 0}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #3f7a1a}
.btn.alt{background:#ffd23f;color:#5a2c00;box-shadow:0 5px 0 #b07a00}
.btn.mini{font-size:13px;padding:4px 10px;margin:0 0 0 auto;box-shadow:0 3px 0 #3f7a1a}
.row{display:flex !important;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.world{display:block !important;width:100%;text-align:left;margin-top:10px;font-size:18px;color:#ffd23f;border-bottom:2px solid rgba(255,210,63,.3)}
.lvgrid{display:grid !important;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;width:100%;margin-top:6px}
.lv{font:inherit;font-size:15px;height:40px;border:none;border-radius:10px;background:#3b6e2a;color:#fff;box-shadow:0 3px 0 #1f3f14;cursor:pointer;padding:0}
.lv.done{background:#7ac943;color:#173b06}
.lv.bossl{background:#a8402a;box-shadow:0 3px 0 #5a1a0a}
.lv.bossl.done{background:#e8742a}
.lv.locked{background:#3a3530;color:#888;box-shadow:none;cursor:default}
.lv.friend{outline:3px solid #5ad1ff}
.txt{font:inherit;font-size:20px;padding:8px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.35);color:#fff;text-align:center;max-width:240px;width:70%;user-select:text;-webkit-user-select:text}
.txt.code{width:120px;text-transform:uppercase;letter-spacing:4px}
.swatches{display:flex !important;gap:8px;margin:4px 0}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer}
.sw.on{border-color:#fff;transform:scale(1.12)}
.code-big{display:block !important;font-size:36px;color:#5ad1ff;letter-spacing:4px;text-shadow:0 3px 0 #0a4a6a;margin:6px 0}
.plist{display:flex !important;flex-direction:column;gap:6px;width:100%;max-width:420px;margin:6px 0}
.prow{display:flex !important;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;font-size:16px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.pn{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{opacity:.75;font-size:13px}
#pauseBtn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:10px;border:none;background:rgba(0,0,0,.35);color:#fff;font-size:18px;cursor:pointer;display:none}
#controls{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:12px 10px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.touch #controls.show{display:flex}
.pad,.rbtns{display:flex;gap:clamp(6px,2.5vw,12px);align-items:flex-end}
.rot{display:none}
@media (orientation:portrait){.touch .rot{display:block}}
.cbtn{pointer-events:auto;width:clamp(50px,15vw,70px);height:clamp(50px,15vw,70px);border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.42);font-size:28px;color:#fff;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-tap-highlight-color:transparent}
.cbtn.jump{width:clamp(62px,19vw,84px);height:clamp(62px,19vw,84px);background:rgba(122,201,67,.3);border-color:rgba(160,230,110,.7)}
.cbtn.sm{width:clamp(46px,13vw,62px);height:clamp(46px,13vw,62px);font-size:24px}
.cbtn.off{opacity:.35}
.cbtn.on{background:rgba(255,210,63,.5)}
.keys{display:inline-block;background:rgba(255,255,255,.15);border-radius:6px;padding:1px 7px;margin:0 2px}
.touch .desk{display:none}
.mob{display:none}
.touch .mob{display:block}
</style>
<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>

<body>
<div id="game"><div id="stage"><canvas id="c"></canvas><button id="pauseBtn" aria-label="Pausa">❚❚</button><div id="overlay"></div></div></div>
<div id="controls">
  <div class="pad"><div class="cbtn" id="bL">◀</div><div class="cbtn" id="bR">▶</div></div>
  <div class="rbtns"><div class="cbtn sm off" id="bA">🗡</div><div class="cbtn sm off" id="bP">✦</div><div class="cbtn jump" id="bJ">⤒</div></div>
</div>
<script>
(function(){
'use strict';
/* ================= CONSTANTES Y MUNDOS ================= */
const W=800,H=480,T=40,ROWS=12,TOTAL_LEVELS=100;
const WORLDS=[
 {name:'Selva Prehistórica',sky:['#4fb3e6','#d6f2c8'],sun:'#fff4b0',far:'#8cc0a5',mid:'#5ea36a',near:'#3e8048',
  ground:'#8b5a33',gDark:'#5f3b1e',gLight:'#a8703f',top:'#62c43c',topD:'#3e8c25',plat:'#a3713f',
  decor:'palm',spike:'bone',weather:'leaves',lava:false,ice:false,night:false,raptor:'#e8712a'},
 {name:'Desierto de Fósiles',sky:['#ee9a46','#fde4a8'],sun:'#fff7d6',far:'#e6b479',mid:'#d4975a',near:'#b97b45',
  ground:'#d6a15a',gDark:'#a46f37',gLight:'#e8bb77',top:'#f2cf86',topD:'#c99c55',plat:'#9c6a3c',
  decor:'cactus',spike:'cactus',weather:'dust',lava:false,ice:false,night:false,raptor:'#b8743a'},
 {name:'Montaña de Fuego',sky:['#2e0d0d','#e0662e'],sun:'#ffcf6b',far:'#4a2222',mid:'#5c2c24',near:'#3a1c18',
  ground:'#4b3530',gDark:'#2c1f1c',gLight:'#634640',top:'#7d5b4b',topD:'#55392f',plat:'#6b5048',
  decor:'rock',spike:'rock',weather:'ash',lava:true,ice:false,night:false,volcano:true,meteors:true,raptor:'#d24a2a'},
 {name:'Glaciar Helado',sky:['#7cc4ee','#eef8ff'],sun:'#ffffff',far:'#bcd9ec',mid:'#94bcd8',near:'#6d9cc0',
  ground:'#6f93b5',gDark:'#4d6f91',gLight:'#8fb0cf',top:'#f4fbff',topD:'#c4dcef',plat:'#8aa9c4',
  decor:'pine',spike:'icicle',weather:'snow',lava:false,ice:true,night:false,raptor:'#7a8fb0'},
 {name:'Noche Jurásica',sky:['#070a22','#3a2a68'],sun:'#f2f0d8',far:'#22224a',mid:'#2b2a55',near:'#1c1c3a',
  ground:'#4a3f5a',gDark:'#2e2740',gLight:'#5e5274',top:'#4f8a5a',topD:'#2f5e3a',plat:'#6a5a7a',
  decor:'ruins',spike:'crystal',weather:'fireflies',lava:true,ice:false,night:true,meteors:true,raptor:'#8a5ad0'}
];
const WEAPONS={
  honda:{name:'Honda',icon:'🪨',cd:16},
  lanza:{name:'Lanza',icon:'🔱',cd:26},
  boomerang:{name:'Bumerán',icon:'🪃',cd:10},
  arco:{name:'Arco',icon:'🏹',cd:13}
};
const POWERS={fire:'Fuego',ice:'Hielo',wing:'Alas'};
function worldOf(L){return Math.min(4,Math.floor((L-1)/20))}

/* ================= RNG ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ================= GENERADOR DE NIVELES ================= */
function genLevel(L){
  const rng=mulberry(L*7919+101);
  const R=(a,b)=>a+Math.floor(rng()*(b-a+1)),ch=p=>rng()<p,pick=a=>a[Math.floor(rng()*a.length)];
  const wi=worldOf(L),world=WORLDS[wi],d=(L-1)/99,isBoss=L%10===0;
  const len=isBoss?44:Math.min(165,64+Math.floor(L*0.95));
  const MW=len+100;
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(MW).fill(' '));
  const ents=[];
  const E=(type,cx,cy,o)=>{ents.push(Object.assign({type,cx,cy},o||{}))};
  const G=(a,b,top)=>{for(let x=a;x<=b;x++)for(let y=top;y<ROWS;y++)g[y][x]='#'};
  const P=(a,b,y)=>{for(let x=a;x<=b;x++)g[y][x]='='};
  const S=(a,b,y)=>{for(let x=a;x<=b;x++)g[y][x]='^'};
  const pit=(a,b)=>{if(world.lava&&ch(0.8))for(let x=a;x<=b;x++)g[11][x]='L'};
  const enemyTypes=['raptor'];if(L>=3)enemyTypes.push('ptero');if(L>=12)enemyTypes.push('ankylo');if(L>=25)enemyTypes.push('dilo');
  const weaponTypes=['honda'];if(L>=5)weaponTypes.push('lanza');if(L>=15)weaponTypes.push('boomerang');if(L>=30)weaponTypes.push('arco');
  const powerTarget=1+(L%3===0?1:0);
  let x=0,h=10,lastCheck=0,lastHeart=0,weapons=0,powers=0;
  G(0,9,10);E('egg',5,9);E('egg',7,9);x=10;
  if(L===1){E('weapon',8,8,{w:'honda'});weapons=1}
  function extras(a,n){
    if(n<4)return;
    if(x-lastHeart>24-Math.floor(d*4)){E('heart',a+Math.floor(n/2),h-2);lastHeart=x;return}
    if(weapons<(len>110?2:1)&&x>14&&(weapons===0||x>len/2)){E('weapon',a+1,h-2,{w:pick(weaponTypes)});weapons++;return}
    if(powers<powerTarget&&x>18&&ch(0.25)){E('power',a+n-2,h-3,{p:pick(['fire','ice','wing'])});powers++;return}
    if(ch(0.7)){const k=R(2,3);for(let i=0;i<k;i++)E('egg',a+1+i,h-1)}
  }
  while(x<len){
    if(x-lastCheck>30){G(x,x+3,h);E('check',x+1,h-1);lastCheck=x;x+=4;continue}
    const wts=[['flat',0.15],['gap',0.2],['step',0.13],['plat',0.1+d*0.1],['haz',0.12+d*0.05],['enemy',0.17+d*0.12],['treasure',0.07]];
    let tot=0;for(const w of wts)tot+=w[1];let r=rng()*tot,kind='flat';for(const w of wts){if(r<w[1]){kind=w[0];break}r-=w[1]}
    if(x<16&&(kind==='plat'||kind==='haz'))kind='flat';
    if(kind==='flat'){const n=R(4,7);G(x,x+n-1,h);extras(x,n);x+=n}
    else if(kind==='gap'){
      const nh=Math.max(6,Math.min(10,h+R(-2,2))),rise=h-nh,maxG=rise>=2?1:rise===1?2:3;
      const gw=Math.max(1,Math.min(maxG,1+Math.floor(rng()*(1.3+d*2))));
      pit(x,x+gw-1);E('egg',x+Math.floor((gw-1)/2),Math.min(h,nh)-3);
      const n=R(4,7);G(x+gw,x+gw+n-1,nh);x+=gw;h=nh;extras(x,n);x+=n;
    }
    else if(kind==='step'){
      let nh=Math.max(6,Math.min(10,h+pick([-2,-1,1,2])));if(nh===h)nh=h===10?9:h+1;
      const n=R(4,7);G(x,x+n-1,nh);h=nh;extras(x,n);x+=n;
    }
    else if(kind==='plat'){
      const sx=x;let px=x+1,pr=Math.max(4,h-2);const k=R(2,3+Math.floor(d*2));
      for(let i=0;i<k;i++){
        const pw=d>0.5?R(2,3):3;P(px,px+pw-1,pr);
        if(ch(0.6))E('egg',px+Math.floor(pw/2),pr-1);
        if(i===1&&enemyTypes.includes('ptero')&&ch(0.35+d*0.4))E('ptero',px,Math.max(1,pr-3));
        px+=pw;
        if(i<k-1){const npr=Math.max(4,Math.min(9,pr+pick([-2,0,2])));px+=npr<pr?1:R(1,2);pr=npr}
      }
      const gp=R(1,2),nh=Math.max(6,Math.min(10,pr+R(0,2)));
      pit(sx,px+gp-1);px+=gp;const n=R(4,6);G(px,px+n-1,nh);x=px;h=nh;extras(x,n);x+=n;
    }
    else if(kind==='haz'){
      const n=R(6,9);G(x,x+n-1,h);const s=x+R(2,n-4),sw=R(1,2);S(s,s+sw-1,h-1);E('egg',s,h-3);
      if(d>0.35&&s+sw+2<x+n-2)S(s+sw+2,s+sw+2,h-1);
      x+=n;
    }
    else if(kind==='enemy'){
      const n=R(8,12);G(x,x+n-1,h);const cnt=Math.min(Math.floor((n-2)/3),1+Math.floor(d*2.5+rng()));
      for(let i=0;i<cnt;i++){const t=pick(enemyTypes);if(t==='ptero')E('ptero',x+2+i*3,Math.max(1,h-4));else E(t,x+2+i*3,h-1)}
      if(ch(0.5))E('egg',x+n-2,h-1);x+=n;
    }
    else{
      const n=R(6,8);G(x,x+n-1,h);const pr=h-2;P(x+2,x+4,pr);for(let i=0;i<3;i++)E('egg',x+2+i,pr-1);
      if(powers<powerTarget+1&&ch(0.5)){E('power',x+3,pr-3,{p:pick(['fire','ice','wing'])});powers++}
      else if(ch(0.3)){E('heart',x+3,pr-3)}
      x+=n;
    }
  }
  let arena=null,LW;
  if(!isBoss){G(x,x+11,h);E('egg',x+2,h-1);E('egg',x+3,h-1);E('nest',x+7,h-1);LW=x+12}
  else{
    G(x,x+4,h);E('check',x+1,h-1);E('heart',x+3,h-2);x+=5;
    const a0=x;G(a0,a0+36,10);G(a0+33,a0+36,0);
    P(a0+3,a0+5,8);P(a0+27,a0+29,8);E('heart',a0+4,7);E('heart',a0+28,7);
    E('power',a0+28,5,{p:pick(['fire','ice'])});E('weapon',a0+9,8,{w:weaponTypes[weaponTypes.length-1]});
    E('boss',a0+22,9);E('nest',a0+16,9,{hidden:true});
    arena={a0,L:(a0+1)*T,R:(a0+33)*T,trigger:(a0+2)*T};LW=a0+37;
  }
  let eggTotal=0;for(const e of ents)if(e.type==='egg')eggTotal++;
  return {L,wi,world,isBoss,arena,LW,grid:g.map(r=>r.slice(0,LW)),ents,eggTotal,d};
}

/* ================= ESTADO ================= */
let lvl=null,grid,LW,ents,player,cam={x:0},parts=[],meteors=[],shots=[],eshots=[],ghosts=[],iceTiles=[],weather=[];
let frame=0,levelNum=1,state='title',eggs=0,levelEggs=0,checkIdx=-1,respawn={x:80,foot:400};
let shakeT=0,shakeM=0,bannerT=0,meteorT=0,boss=null,dyingT=0,msgT=0,msg='',ckCounter=0;
let carry={weapon:null,power:null};
const keys={left:false,right:false,jump:false,power:false,attack:false};
let jumpPressed=false,powerPressed=false,attackPressed=false;
const PH_M=44,PW_M=30,PH_F=30,PW_F=18;

function makeEnt(r){
  const cx=r.cx,cy=r.cy,foot=(cy+1)*T;let e;
  switch(r.type){
    case 'egg':e={x:cx*T+11,y:cy*T+8,w:18,h:24};break;
    case 'heart':e={x:cx*T+6,y:cy*T+6,w:28,h:28};break;
    case 'power':e={x:cx*T+6,y:cy*T+6,w:28,h:28,p:r.p};break;
    case 'weapon':e={x:cx*T+4,y:cy*T+8,w:32,h:30,wpn:r.w};break;
    case 'raptor':e={x:cx*T,y:foot-30,w:38,h:30,vx:0,vy:0,dir:-1,walk:Math.random()*6,hp:1};break;
    case 'ankylo':e={x:cx*T-6,y:foot-30,w:54,h:30,vx:0,vy:0,dir:-1,walk:0,hp:3};break;
    case 'dilo':e={x:cx*T+2,y:foot-40,w:34,h:40,vx:0,vy:0,dir:-1,walk:0,hp:2,cd:60+Math.random()*80};break;
    case 'ptero':e={x:cx*T,y:cy*T,w:46,h:26,bx:cx*T,by:cy*T,t:Math.random()*600,dir:1,hp:1};break;
    case 'check':e={x:cx*T+12,y:foot-64,w:20,h:64,on:false,id:ckCounter++};break;
    case 'nest':e={x:cx*T-12,y:foot-30,w:64,h:30,hidden:!!r.hidden};break;
    case 'boss':{const wi=lvl.wi;const hp=12+wi*4+(lvl.L===100?12:0);
      e={x:cx*T,y:foot-78,w:104,h:78,hp,hpMax:hp,st:'sleep',t:0,dir:-1,inv:0,jaw:0,spd:1+wi*0.13+(lvl.L===100?0.15:0),king:lvl.L===100};boss=e;break}
  }
  e.type=r.type;e.dead=false;e.frozen=0;e.flash=0;return e;
}
function newPlayer(){
  return {x:2*T,y:10*T-PH_M,w:PW_M,h:PH_M,vx:0,vy:0,face:1,onGround:false,coyote:0,jumpBuf:0,jumping:false,
    inv:0,stun:0,walk:0,mounted:true,dinoHp:3,humanHp:3,power:carry.power,flyT:0,pCD:0,weapon:carry.weapon,wCD:0,aim:0};
}
function loadLevel(L,fromCheck){
  levelNum=L;lvl=genLevel(L);grid=lvl.grid.map(r=>r.slice());LW=lvl.LW;
  parts=[];meteors=[];shots=[];eshots=[];ghosts=[];iceTiles=[];boss=null;ckCounter=0;
  ents=lvl.ents.map(makeEnt);
  player=newPlayer();respawn={x:player.x,foot:player.y+player.h};
  if(fromCheck&&checkIdx>=0){
    const c=ents.find(e=>e.type==='check'&&e.id===checkIdx);
    if(c){c.on=true;respawn={x:c.x-6,foot:c.y+c.h};player.x=respawn.x;player.y=respawn.foot-player.h}
  }else checkIdx=-1;
  levelEggs=0;cam.x=Math.max(0,Math.min(player.x-W*0.4,LW*T-W));
  bannerT=170;meteorT=200;initWeather();
}

/* ================= FÍSICA ================= */
function tileAt(tx,ty){if(tx<0||tx>=LW||ty<0||ty>=ROWS)return ' ';return grid[ty][tx]}
function solid(tx,ty){if(tx<0||tx>=LW)return true;if(ty<0||ty>=ROWS)return false;const c=grid[ty][tx];return c==='#'||c==='I'}
function moveBody(e){
  e.onGround=false;e.hitWall=0;e.x+=e.vx;
  const top=Math.floor(e.y/T),bot=Math.floor((e.y+e.h-0.01)/T);
  if(e.vx>0){const c=Math.floor((e.x+e.w)/T);for(let r=top;r<=bot;r++)if(solid(c,r)){e.x=c*T-e.w-0.01;e.vx=0;e.hitWall=1;break}}
  else if(e.vx<0){const c=Math.floor(e.x/T);for(let r=top;r<=bot;r++)if(solid(c,r)){e.x=(c+1)*T;e.vx=0;e.hitWall=-1;break}}
  const prevBottom=e.y+e.h;e.y+=e.vy;
  const l=Math.floor(e.x/T),rr=Math.floor((e.x+e.w-0.01)/T);
  if(e.vy>0){const r=Math.floor((e.y+e.h)/T);
    for(let c=l;c<=rr;c++){if(solid(c,r)||(tileAt(c,r)==='='&&prevBottom<=r*T+0.5)){e.y=r*T-e.h;e.vy=0;e.onGround=true;break}}}
  else if(e.vy<0){const r=Math.floor(e.y/T);for(let c=l;c<=rr;c++)if(solid(c,r)){e.y=(r+1)*T;e.vy=0;break}}
}
function overlap(a,b,pad){pad=pad||0;return a.x+pad<b.x+b.w&&a.x+a.w-pad>b.x&&a.y+pad<b.y+b.h&&a.y+a.h-pad>b.y}
function puff(x,y,color,n,spd,size,grav){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(grav?spd*0.4:0),life:30+Math.random()*25,max:55,color,size:size||4,g:grav?0.25:0})}}
function shake(m,t){shakeM=Math.max(shakeM,m);shakeT=Math.max(shakeT,t)}
function flash(t){msg=t;msgT=140}

/* ================= DAÑO / VIDA ================= */
function setBody(mounted){
  const p=player,foot=p.y+p.h,cx=p.x+p.w/2;
  p.mounted=mounted;p.w=mounted?PW_M:PW_F;p.h=mounted?PH_M:PH_F;p.x=cx-p.w/2;p.y=foot-p.h;
  if(mounted){for(let i=0;i<3;i++){const t=Math.floor(p.y/T),l=Math.floor(p.x/T),r=Math.floor((p.x+p.w-1)/T);let hit=false;for(let c=l;c<=r;c++)if(solid(c,t))hit=true;if(!hit)break;p.y=(t+1)*T}}
}
function hurt(fromX){
  const p=player;if(p.inv>0||state!=='play')return;
  p.vy=-7;p.vx=(p.x+p.w/2<fromX?-1:1)*5.5;p.stun=16;p.inv=100;
  sfx.hurt();shake(6,14);puff(p.x+p.w/2,p.y+p.h/2,'#ff5a5a',12,3);
  loseLife();
}
function loseLife(){
  const p=player;
  if(p.mounted){p.dinoHp--;if(p.power){p.power=null;p.flyT=0}if(p.dinoHp<=0)dinoDown()}
  else{p.humanHp--;if(p.humanHp<=0)die()}
}
function dinoDown(){
  const p=player;ghosts.push({x:p.x+p.w/2,y:p.y+p.h,t:0,face:p.face});
  p.power=null;p.flyT=0;setBody(false);p.vy=-8;
  flash('¡Tu dino cayó! Buscá un ❤ para revivirlo');sfx.dinoDown();ensureHeartAhead();
}
function revive(){
  const p=player;setBody(true);p.dinoHp=2;p.inv=90;sfx.revive();
  puff(p.x+p.w/2,p.y+p.h/2,'#ffd23f',26,4,4);flash('¡Dino revivido! 🦖');
}
function ensureHeartAhead(){
  const p=player,c0=Math.floor(p.x/T);
  if(ents.some(e=>e.type==='heart'&&!e.dead&&e.x>p.x-T*2&&e.x<p.x+T*28))return;
  for(let c=c0+6;c<Math.min(LW-2,c0+28);c++){
    for(let r=2;r<ROWS;r++){const t=tileAt(c,r);
      if(t==='#'||t==='='||t==='I'){if(tileAt(c,r-1)===' '&&tileAt(c,r-2)===' '){const e=makeEnt({type:'heart',cx:c,cy:r-2});ents.push(e);puff(e.x+14,e.y+14,'#ff8fa3',12,3,3);return}break}
      if(t!==' ')break}}
}
function fallOut(){
  const p=player;sfx.hurt();shake(5,12);loseLife();if(state!=='play')return;
  p.x=respawn.x+(PW_M-p.w)/2;p.y=respawn.foot-p.h;p.vx=p.vy=0;p.inv=110;p.flyT=0;
}
function die(){state='dying';dyingT=0;player.vy=-9;sfx.lose()}

/* ================= DISPAROS ================= */
function firePower(){
  const p=player;
  if(!p.mounted){flash('Sin dino no hay poderes');return}
  if(!p.power||p.power==='wing'){flash(p.power==='wing'?'Con alas: mantené saltar para volar':'Agarrá un poder ✦');return}
  if(p.pCD>0||shots.filter(s=>s.kind==='fire'||s.kind==='ice').length>=3)return;
  const fire=p.power==='fire';p.pCD=16;
  shots.push({kind:p.power,x:p.x+p.w/2+p.face*14-7,y:p.y+22,vx:p.face*(fire?8:7.5),vy:fire?1:-2.5,w:14,h:14,life:110,spin:0,grav:fire?0.5:0.22,dmg:1});
  fire?sfx.fireShot():sfx.iceShot();
}
function useWeapon(){
  const p=player;
  if(!p.weapon){flash('Buscá un arma 📦');return}
  if(p.wCD>0)return;
  const wp=p.weapon,f=p.face,ox=p.x+p.w/2+f*8,oy=p.mounted?p.y+4:p.y+8;
  p.wCD=WEAPONS[wp].cd;p.aim=10;
  if(wp==='honda'){shots.push({kind:'rock',x:ox-5,y:oy,vx:f*9.5,vy:-3.2,w:10,h:10,life:90,grav:0.32,dmg:1});sfx.sling()}
  else if(wp==='lanza'){shots.push({kind:'spear',x:ox-15,y:oy,vx:f*10.5,vy:-1.6,w:30,h:7,life:90,grav:0.1,dmg:2,pierce:true,hit:[]});sfx.spear()}
  else if(wp==='arco'){shots.push({kind:'arrow',x:ox-12,y:oy+2,vx:f*13.5,vy:-0.4,w:24,h:5,life:70,grav:0.03,dmg:2});sfx.bow()}
  else if(wp==='boomerang'){
    if(shots.some(s=>s.kind==='boom'))return;
    shots.push({kind:'boom',x:ox-9,y:oy,vx:f*10,vy:0,w:18,h:18,life:160,grav:0,dmg:1,pierce:true,hit:[],t:0,spin:0,dir:f});sfx.boom2()}
}
function updateShots(){
  const p=player;
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];let kill=false;s.life--;s.spin=(s.spin||0)+0.35;
    if(s.kind==='boom'){
      s.t++;
      if(s.t<22){s.vx=s.dir*10*(1-s.t/30)}
      else{const dx=(p.x+p.w/2)-(s.x+9),dy=(p.y+12)-(s.y+9),dl=Math.hypot(dx,dy)||1;s.vx+=dx/dl*1.1;s.vy+=dy/dl*1.1;const sp=Math.hypot(s.vx,s.vy);if(sp>11){s.vx*=11/sp;s.vy*=11/sp}
        if(s.t===22)s.hit=[];
        if(overlap(s,p)){shots.splice(i,1);continue}}
      s.x+=s.vx;s.y+=s.vy;
    }else{
      s.vy+=s.grav;s.x+=s.vx;
      const cy=Math.floor((s.y+s.h/2)/T),cxF=Math.floor((s.x+(s.vx>0?s.w:0))/T);
      if(solid(cxF,cy))kill=true;
      s.y+=s.vy;
      const cx=Math.floor((s.x+s.w/2)/T),by=Math.floor((s.y+s.h)/T),bt=tileAt(cx,by);
      if(!kill&&s.vy>0&&(solid(cx,by)||bt==='=')){
        if(s.kind==='fire'){s.y=by*T-s.h;s.vy=-6}else kill=true;
      }
      if(!kill&&s.kind==='ice'){
        let ly=-1;for(let yy=by;yy<=by+3&&yy<ROWS;yy++){const tt=tileAt(cx,yy);if(tt==='L'){ly=yy;break}if(tt!==' ')break}
        if(ly>=0){for(let xx=cx-1;xx<=cx+2;xx++)if(tileAt(xx,ly)==='L'){grid[ly][xx]='I';iceTiles.push({x:xx,y:ly,t:480})}
          sfx.freeze();puff(cx*T+20,ly*T+10,'#bdf4ff',14,3,3);kill=true}
      }
      if(!kill&&bt==='L'&&s.y+s.h>by*T+12){puff(s.x+7,s.y+7,'#ddd',6,2,4);kill=true}
    }
    if(!kill){
      for(const e of ents){
        if(e.dead||!(e.type==='raptor'||e.type==='ptero'||e.type==='ankylo'||e.type==='dilo'||e.type==='boss'))continue;
        if(e.type==='boss'&&(e.st==='sleep'||e.st==='dead'))continue;
        if(!overlap(s,e))continue;
        if(s.pierce){if(s.hit.includes(e))continue;s.hit.push(e)}
        damageEnemy(e,s.dmg,s.kind,Math.sign(s.vx)||p.face);
        if(!s.pierce){kill=true;break}
      }
    }
    if(!kill)for(let j=meteors.length-1;j>=0;j--){if(overlap(s,meteors[j])){explode(meteors[j]);meteors.splice(j,1);if(!s.pierce)kill=true;break}}
    if(!kill)for(let j=eshots.length-1;j>=0;j--){if(overlap(s,eshots[j])){puff(eshots[j].x,eshots[j].y,'#9be35a',6,2,3);eshots.splice(j,1);if(!s.pierce)kill=true;break}}
    if(s.life<=0||s.y>H+20||s.x<cam.x-80||s.x>cam.x+W+80)kill=true;
    if(kill){
      const col=s.kind==='fire'?'#ffb02e':s.kind==='ice'?'#bdf4ff':'#d8c8a8';
      puff(s.x+s.w/2,s.y+s.h/2,col,6,2,3);shots.splice(i,1);
    }
  }
}
function damageEnemy(e,dmg,src,dir){
  if(e.type==='boss')return bossHit(e,dmg,src);
  if(src==='ice'){if(e.frozen>0)shatter(e);else{e.frozen=300;sfx.freeze();puff(e.x+e.w/2,e.y+e.h/2,'#bdf4ff',10,2,3)}return}
  if(e.frozen>0){shatter(e);return}
  e.hp-=dmg;e.flash=8;
  if(e.hp<=0)killEnemy(e,dir);else{sfx.hit();puff(e.x+e.w/2,e.y+e.h/2,'#fff',6,2,3)}
}
function killEnemy(e,dir){
  e.dead=true;e.vy=-4;e.vx=(dir||1)*1.5;sfx.stomp();puff(e.x+e.w/2,e.y+e.h/2,'#fff',10,3,3);
  if(Math.random()<0.25){const g=makeEnt({type:'egg',cx:0,cy:0});g.x=e.x+e.w/2-9;g.y=e.y;g.drop=true;g.vy=-5;ents.push(g)}
}
function shatter(e){e.dead=true;e.frozen=0;e.gone=true;sfx.shatter();puff(e.x+e.w/2,e.y+e.h/2,'#bdf4ff',16,4,4,true)}
function explode(m){puff(m.x+11,m.y+18,'#ff7b2e',16,4,4,true);puff(m.x+11,m.y+18,'#5a4a42',8,2,5);shake(4,10);sfx.boom()}

/* ================= JEFE ================= */
function bossHit(e,dmg,src){
  if(src==='ice'){if(e.st!=='frozen'){e.st='frozen';e.t=0;sfx.freeze();flash('¡Jefe congelado! Saltale encima')}return}
  if(src==='stomp'){if(e.inv>0)return;e.inv=60;dmg=4}
  else if(e.inv>40)return;
  e.hp-=dmg;e.flash=8;puff(e.x+e.w/2,e.y+20,src==='fire'?'#ff7b1e':'#fff',8,3,4);
  if(src!=='stomp')tone(220,160,0.08,'square',0.08);
  shake(src==='stomp'?7:2,src==='stomp'?16:4);
  if(e.hp<=0){e.hp=0;e.st='dead';e.t=0;sfx.roar()}
  else if(src==='stomp'){e.st='roar';e.t=-25;sfx.roar()}
}
function updateBoss(e){
  const p=player,A=lvl.arena;
  if(e.inv>0)e.inv--;if(e.flash>0)e.flash--;e.jaw*=0.9;
  if(e.st==='sleep'){
    if(p.x>A.trigger){for(let y=6;y<=9;y++)grid[y][A.a0]='#';e.st='roar';e.t=0;sfx.roar();shake(8,40);flash(e.king?'¡EL REY T-REX!':'¡Cuidado! ¡El T-Rex!')}
    return;
  }
  if(e.st==='dead'){e.t++;if(e.t%6===0)puff(e.x+Math.random()*e.w,e.y+Math.random()*e.h,'#ffd23f',6,3,3);
    if(e.t===90){e.dead=true;const n=ents.find(q=>q.type==='nest');if(n){n.hidden=false;puff(n.x+32,n.y+10,'#9cff6e',30,5,4)}sfx.win();flash('¡Ganaste! Andá al nido')}
    return}
  e.t++;const sp=e.spd*(e.hp<e.hpMax/3?1.25:1);
  if(e.st==='roar'){e.jaw=1;if(e.t%10===0)shake(3,8);e.dir=(p.x+p.w/2<e.x+e.w/2)?-1:1;
    if(e.t===20&&lvl.wi>=2)for(let i=0;i<3;i++)meteors.push({x:p.x-80+i*80+Math.random()*30,y:-40-i*50,vx:0,vy:5,w:22,h:22});
    if(e.t>55){e.st='charge';e.t=0}}
  else if(e.st==='walk'){e.dir=(p.x+p.w/2<e.x+e.w/2)?-1:1;e.x+=e.dir*1.5*sp;if(e.t>100){e.st='roar';e.t=0;sfx.roar()}}
  else if(e.st==='charge'){e.x+=e.dir*6.2*sp;if(frame%3===0)puff(e.x+(e.dir>0?0:e.w),e.y+e.h,'rgba(220,200,170,.8)',2,1.5,4);
    if(e.x<A.L||e.x+e.w>A.R){e.x=Math.max(A.L,Math.min(e.x,A.R-e.w));e.st='stun';e.t=0;shake(9,22);sfx.boom()}}
  else if(e.st==='stun'){if(e.t>85){e.st='walk';e.t=0}}
  else if(e.st==='frozen'){if(e.t>150){e.st='walk';e.t=0;puff(e.x+e.w/2,e.y+e.h/2,'#bdf4ff',20,4,4)}}
  e.x=Math.max(A.L,Math.min(e.x,A.R-e.w));
  if(overlap(p,e,6)){
    if(p.vy>0&&p.y+p.h-p.vy<=e.y+18&&e.inv<=0){p.vy=-11.5;p.jumping=false;sfx.stomp();puff(p.x+p.w/2,e.y,'#fff',14,4,3);bossHit(e,4,'stomp')}
    else if(e.inv<=0&&e.st!=='frozen')hurt(e.x+e.w/2);
  }
}

/* ================= ENEMIGOS ================= */
function stompOrHurt(e,bounce){
  const p=player;if(!overlap(p,e,4))return;
  if(e.frozen>0){shatter(e);return}
  if(p.vy>0&&p.y+p.h-p.vy<=e.y+14){
    p.vy=bounce;p.jumping=false;
    if(e.type==='ankylo'){e.hp--;e.flash=8;sfx.hit();if(e.hp<=0)killEnemy(e,p.face);else puff(e.x+e.w/2,e.y,'#fff',6,2,3)}
    else killEnemy(e,p.face);
  }else hurt(e.x+e.w/2);
}
function updateEnemy(e){
  const p=player,near=Math.abs(e.x-p.x)<W*1.1;
  if(e.flash>0)e.flash--;
  if(e.dead){if(e.gone)return;e.vy=(e.vy||0)+0.5;e.y+=e.vy;e.x+=e.vx||0;return}
  if(!near)return;
  if(e.type==='ptero'){
    if(e.frozen>0){e.frozen--;if(overlap(p,e,2))shatter(e);return}
    e.t++;const amp=130+lvl.d*60;const nx=e.bx+Math.sin(e.t*0.02*(1+lvl.d*0.6))*amp;e.dir=nx>e.x?1:-1;e.x=nx;e.y=e.by+Math.sin(e.t*0.06)*18;
    stompOrHurt(e,-10);return;
  }
  if(e.frozen>0){e.frozen--;e.vx=0;e.vy=Math.min(e.vy+0.62,13);moveBody(e);if(overlap(p,e,2))shatter(e);return}
  let spd=e.type==='raptor'?1.4+lvl.d*1.3:e.type==='ankylo'?0.7:0.5;
  if(e.type==='raptor'&&lvl.d>0.25&&Math.abs(p.x-e.x)<220&&Math.abs(p.y-e.y)<60){e.dir=p.x<e.x?-1:1;spd*=1.5}
  if(e.type==='dilo'){
    e.dir=p.x<e.x?-1:1;spd=0;e.cd--;
    if(e.cd<=0&&Math.abs(p.x-e.x)<380){e.cd=120-lvl.d*45;eshots.push({x:e.x+e.w/2+e.dir*14,y:e.y+10,vx:e.dir*4.5,vy:-3.2,w:12,h:12,life:150});sfx.spit();e.spit=12}
    if(e.spit>0)e.spit--;
  }
  e.vx=e.dir*spd;e.vy=Math.min(e.vy+0.62,13);moveBody(e);e.walk+=spd*0.12;
  if(e.hitWall)e.dir*=-1;
  else if(e.onGround&&spd>0){const fx=e.dir>0?e.x+e.w+2:e.x-2,fr=Math.floor((e.y+e.h+2)/T),fc=Math.floor(fx/T);
    if(!solid(fc,fr)&&tileAt(fc,fr)!=='=')e.dir*=-1}
  if(e.y>H+50){e.dead=true;e.gone=true}
  stompOrHurt(e,-9.5);
}

/* ================= UPDATE ================= */
function update(){
  frame++;
  if(shakeT>0)shakeT--;else shakeM=0;
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g;q.vx*=0.96;q.life--;if(q.life<=0)parts.splice(i,1)}
  updateWeather();
  for(let i=ghosts.length-1;i>=0;i--){ghosts[i].t++;if(ghosts[i].t>90)ghosts.splice(i,1)}
  if(state==='dying'){dyingT++;player.y+=player.vy;player.vy+=0.5;if(dyingT===80)onGameOver();return}
  if(state!=='play')return;
  if(bannerT>0)bannerT--;if(msgT>0)msgT--;
  const p=player,ice=lvl.world.ice;
  const dir=p.stun>0?0:(keys.right?1:0)-(keys.left?1:0);
  if(p.stun>0)p.stun--;
  if(dir)p.face=dir;
  const spd=p.mounted?4.6:4.2,acc=p.onGround?(ice?0.07:0.28):0.14;
  if(p.stun<=0)p.vx+=(dir*spd-p.vx)*acc;
  if(jumpPressed){p.jumpBuf=8;jumpPressed=false}
  if(p.jumpBuf>0)p.jumpBuf--;
  if(p.onGround)p.coyote=7;else if(p.coyote>0)p.coyote--;
  if(p.jumpBuf>0&&p.coyote>0&&p.stun<=0){p.vy=p.mounted?-12.2:-11.8;p.jumpBuf=0;p.coyote=0;p.jumping=true;sfx.jump();puff(p.x+p.w/2,p.y+p.h,'rgba(255,255,255,.7)',5,1.5,3)}
  if(p.jumping&&!keys.jump&&p.vy<-4)p.vy=-4;
  if(p.vy>=0)p.jumping=false;
  if(p.flyT>0&&p.mounted){
    p.flyT--;
    if(keys.jump&&p.stun<=0)p.vy=Math.max(p.vy-1.0,-5.2);else p.vy=Math.min(p.vy+0.35,3.2);
    if(frame%5===0&&!p.onGround)parts.push({x:p.x+p.w/2-p.face*10,y:p.y+20,vx:-p.face*0.5,vy:0.6,life:25,max:25,color:'#ffffff',size:3,g:0});
    if(p.flyT===120)flash('¡Las alas se cansan!');
    if(p.flyT===0){flash('Vuelo terminado');if(p.power==='wing')p.power=null}
  }else p.vy=Math.min(p.vy+0.62,13);
  if(p.y<-10){p.y=-10;if(p.vy<0)p.vy=0}
  const wasAir=!p.onGround,vyB=p.vy;
  moveBody(p);
  if(p.onGround&&wasAir&&vyB>6)puff(p.x+p.w/2,p.y+p.h,ice?'#ffffff':'rgba(255,255,255,.6)',6,1.8,3);
  if(p.onGround&&Math.abs(p.vx)>0.5)p.walk+=Math.abs(p.vx)*0.09;else if(p.onGround)p.walk=0;
  if(p.inv>0)p.inv--;if(p.pCD>0)p.pCD--;if(p.wCD>0)p.wCD--;if(p.aim>0)p.aim--;
  if(powerPressed){powerPressed=false;firePower()}
  if(attackPressed){attackPressed=false;useWeapon()}
  // peligros
  const l=Math.floor(p.x/T),r=Math.floor((p.x+p.w)/T),t=Math.floor(p.y/T),bt=Math.floor((p.y+p.h)/T);
  for(let y=t;y<=bt;y++)for(let x=l;x<=r;x++){
    const c=tileAt(x,y);
    if(c==='^'&&overlap(p,{x:x*T+6,y:y*T+16,w:T-12,h:T-16})){hurt(p.x+p.w/2-p.face*10);if(state!=='play')return;p.vy=-9}
    if(c==='L'&&overlap(p,{x:x*T,y:y*T+16,w:T,h:T-16})){puff(p.x+p.w/2,y*T+16,'#ffb02e',18,4,4,true);fallOut();return}
  }
  if(p.y>H+40){fallOut();return}
  // entidades
  for(const e of ents){
    if(e.dead&&e.type!=='raptor'&&e.type!=='ptero'&&e.type!=='ankylo'&&e.type!=='dilo')continue;
    switch(e.type){
      case 'egg':
        if(e.drop){e.vy+=0.4;e.y+=e.vy;const r2=Math.floor((e.y+e.h)/T),c2=Math.floor((e.x+9)/T);if(e.vy>0&&(solid(c2,r2)||tileAt(c2,r2)==='=')){e.y=r2*T-e.h;e.vy=0;e.drop=false}if(e.y>H){e.dead=true;break}}
        if(overlap(p,e)){e.dead=true;eggs++;levelEggs++;sfx.egg();puff(e.x+9,e.y+12,'#fff6c8',10,3,3)}break;
      case 'heart':
        if(overlap(p,e)){e.dead=true;sfx.meat();puff(e.x+14,e.y+14,'#ff8fa3',12,3,3);
          if(!p.mounted)revive();else if(p.dinoHp<3){p.dinoHp++;flash('+1 ❤ dino')}else if(p.humanHp<3){p.humanHp++;flash('+1 ❤ jinete')}else{eggs+=2;levelEggs+=2;flash('+2 🥚')}}break;
      case 'power':
        if(overlap(p,e)){
          if(!p.mounted){if(!e.warn){flash('Necesitás tu dino para usar poderes');e.warn=60}else e.warn--;break}
          e.dead=true;sfx.power();
          if(e.p==='wing'){p.flyT=600;flash('¡ALAS! Mantené saltar para volar');puff(e.x+14,e.y+14,'#ffffff',16,3,4)}
          else{p.power=e.p;flash(e.p==='fire'?'¡FUEGO! Tocá ✦ para disparar':'¡HIELO! Congelá enemigos y lava');puff(e.x+14,e.y+14,e.p==='fire'?'#ff7b1e':'#8ee8ff',16,3,4)}}break;
      case 'weapon':
        if(overlap(p,e)){e.dead=true;p.weapon=e.wpn;sfx.power();flash('¡'+WEAPONS[e.wpn].name+'! Tocá 🗡 para atacar');puff(e.x+16,e.y+14,'#ffd23f',16,3,4)}break;
      case 'check':
        if(!e.on&&overlap(p,e)){e.on=true;checkIdx=e.id;respawn={x:e.x-6,foot:e.y+e.h};sfx.check();puff(e.x+10,e.y+10,'#9cff6e',14,3,3);flash('¡Punto de control!')}break;
      case 'nest':if(!e.hidden&&overlap(p,e))levelClear();break;
      case 'boss':updateBoss(e);break;
      default:updateEnemy(e);
    }
    if(state!=='play')return;
  }
  // disparos enemigos
  for(let i=eshots.length-1;i>=0;i--){const s=eshots[i];s.vy+=0.18;s.x+=s.vx;s.y+=s.vy;s.life--;
    if(overlap(p,s,2)){hurt(s.x);eshots.splice(i,1);continue}
    if(solid(Math.floor((s.x+6)/T),Math.floor((s.y+6)/T))||s.life<=0||s.y>H){puff(s.x+6,s.y+6,'#9be35a',6,2,3);eshots.splice(i,1)}}
  // meteoritos
  if(lvl.world.meteors&&!lvl.isBoss){
    if(--meteorT<=0){meteorT=Math.max(90,200-lvl.d*110)+Math.random()*80;meteors.push({x:cam.x+120+Math.random()*(W-80),y:-40,vx:-1.3,vy:5.2,w:22,h:22})}
  }
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x+=m.vx;m.y+=m.vy;
    if(frame%2===0)parts.push({x:m.x+11,y:m.y+6,vx:Math.random()-0.5,vy:-0.5,life:18,max:18,color:'#ffb02e',size:5,g:0});
    const cx=Math.floor((m.x+11)/T),cy=Math.floor((m.y+20)/T);
    if(overlap(p,m,3)){hurt(m.x+11);explode(m);meteors.splice(i,1);continue}
    if(solid(cx,cy)||tileAt(cx,cy)==='L'||m.y>H){explode(m);meteors.splice(i,1)}}
  updateShots();
  for(let i=iceTiles.length-1;i>=0;i--){const it=iceTiles[i];if(--it.t<=0){grid[it.y][it.x]='L';iceTiles.splice(i,1);puff(it.x*T+20,it.y*T+10,'#cfe',6,2,3)}}
  const target=Math.max(0,Math.min(p.x+p.w/2-W*0.42,LW*T-W));
  cam.x+=(target-cam.x)*0.12;
  netTick();
}

const tileCache={};
function tilesFor(wi){
  if(tileCache[wi])return tileCache[wi];
  const w=WORLDS[wi],S=2,res={inner:[],top:[]};
  for(let v=0;v<4;v++){
    for(const kind of ['inner','top']){
      const c=mkCanvas(T*S,T*S),g=c.getContext('2d');g.scale(S,S);
      const gr=g.createLinearGradient(0,0,0,T);gr.addColorStop(0,w.ground);gr.addColorStop(1,w.gDark);
      g.fillStyle=gr;g.fillRect(0,0,T,T);
      g.strokeStyle='rgba(0,0,0,.12)';g.lineWidth=1.2;
      for(let i=0;i<2;i++){const yy=10+i*16+hash(v*9+i)*6;g.beginPath();g.moveTo(0,yy);g.bezierCurveTo(12,yy-3,26,yy+3,T,yy-1);g.stroke()}
      for(let i=0;i<3;i++){const sx=hash(v*31+i*7)*34+3,sy=hash(v*17+i*3)*30+(kind==='top'?14:5),sr=2+hash(v+i*5)*3.5;
        g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(sx+1,sy+1,sr,sr*0.7,0,0,7);g.fill();
        g.fillStyle=w.gLight;g.beginPath();g.ellipse(sx,sy,sr,sr*0.7,0,0,7);g.fill();
        g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(sx-sr*0.3,sy-sr*0.3,sr*0.4,sr*0.25,0,0,7);g.fill()}
      if(kind==='top'){
        g.fillStyle=w.topD;g.beginPath();g.moveTo(0,0);g.lineTo(T,0);g.lineTo(T,11);
        for(let i=8;i>=0;i--)g.lineTo(i*5,11+Math.sin(i*1.7+v)*3+(i%2)*2);g.closePath();g.fill();
        g.fillStyle=w.top;g.beginPath();g.moveTo(0,0);g.lineTo(T,0);g.lineTo(T,8);
        for(let i=8;i>=0;i--)g.lineTo(i*5,8+Math.sin(i*1.3+v*2)*2);g.closePath();g.fill();
        g.fillStyle='rgba(255,255,255,.28)';g.fillRect(0,1,T,2);
      }
      res[kind].push(c);
    }
  }
  return tileCache[wi]=res;
}

/* ================= ONLINE SIN CLAUDE (PeerJS, entre navegadores) ================= */
function makeP2P(){
  if(typeof window.Peer!=='function')return null;
  const PREFIX='dinoaventura-v1-';
  const CFG={debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}]}};
  return {p2p:true,join(name,host){return new Promise((resolve,reject)=>{
    const code=String(name).replace(/^dino-/,'');
    let listeners=[],errL=[],closed=false,ok=false,timer=null,conn=null,lastSnap=[];
    const peers=new Map(),conns=new Map(),myPres={};let peer;
    const selfId=()=>peer&&peer.id;
    const snapshot=()=>{const a=[];for(const [id,pr] of peers)a.push({peer:id,sameTab:id===selfId(),isMe:id===selfId(),presence:pr,guest:false,kind:'viewer',by:null});return a};
    let lastSig='';
    const emit=left=>{const sig=JSON.stringify([...peers]);if(sig===lastSig&&!(left&&left.length))return;lastSig=sig;lastSnap=snapshot();for(const f of listeners)try{f({peers:lastSnap,joined:[],left:left||[],updated:[]})}catch(e){}};
    const fail=(c,m)=>{if(closed)return;closed=true;clearInterval(timer);for(const f of errL)try{f({code:c,message:m})}catch(e){}try{peer.destroy()}catch(e){}};
    const api={name,
      presence(o){for(const k in o){if(o[k]===null)delete myPres[k];else myPres[k]=o[k]}
        if(selfId())peers.set(selfId(),Object.assign({},myPres));
        if(!host&&conn&&conn.open)try{conn.send({t:'p',d:myPres})}catch(e){}
        return Promise.resolve()},
      onPeers(f,err){listeners.push(f);if(err)errL.push(err);setTimeout(()=>{lastSnap=snapshot();try{f({peers:lastSnap,joined:lastSnap,left:[],updated:[]})}catch(e){}},0);return()=>{listeners=listeners.filter(x=>x!==f)}},
      peers(){return lastSnap},connected(){return !closed},
      leave(){closed=true;clearInterval(timer);try{peer.destroy()}catch(e){}return Promise.resolve()}};
    const done=()=>{ok=true;resolve(api)};
    const bad=e=>{if(!ok){try{peer.destroy()}catch(_){}reject(e)}};
    if(host){
      peer=new window.Peer(PREFIX+code,CFG);
      peer.on('open',id=>{peers.set(id,Object.assign({},myPres));done();
        timer=setInterval(()=>{if(closed)return;const all=[];for(const [id,pr] of peers)all.push([id,pr]);
          const msg={t:'all',p:all};for(const c of conns.values())if(c.open)try{c.send(msg)}catch(e){}emit()},80)});
      peer.on('connection',c=>{
        if(conns.size>=7){c.on('open',()=>{try{c.send({t:'full'});setTimeout(()=>c.close(),300)}catch(e){}});return}
        conns.set(c.peer,c);
        c.on('data',m=>{if(m&&m.t==='p'&&m.d&&typeof m.d==='object'&&JSON.stringify(m.d).length<2000)peers.set(c.peer,m.d)});
        const gone=()=>{conns.delete(c.peer);if(peers.delete(c.peer))emit([{peer:c.peer}])};
        c.on('close',gone);c.on('error',gone)});
      peer.on('error',e=>{if(e.type==='unavailable-id')bad({code:'taken'});else if(!ok)bad({code:'net',message:e.type})});
      peer.on('disconnected',()=>{if(!closed)try{peer.reconnect()}catch(e){}});
    }else{
      peer=new window.Peer(undefined,CFG);
      const to=setTimeout(()=>bad({code:'notfound'}),15000);
      peer.on('open',()=>{
        conn=peer.connect(PREFIX+code,{serialization:'json',reliable:true});
        conn.on('open',()=>{clearTimeout(to);peers.set(peer.id,Object.assign({},myPres));try{conn.send({t:'p',d:myPres})}catch(e){}done()});
        conn.on('data',m=>{
          if(m&&m.t==='full'){clearTimeout(to);bad({code:'full'});return}
          if(!m||m.t!=='all'||!Array.isArray(m.p))return;
          const before=new Set(peers.keys());peers.clear();
          for(const it of m.p)if(Array.isArray(it)&&typeof it[0]==='string'&&it[1]&&typeof it[1]==='object')peers.set(it[0],it[1]);
          peers.set(peer.id,Object.assign({},myPres));
          emit([...before].filter(id=>!peers.has(id)).map(id=>({peer:id})))});
        conn.on('close',()=>{if(ok)fail('closed','La sala se cerró')});
      });
      peer.on('error',e=>{clearTimeout(to);if(e.type==='peer-unavailable')bad({code:'notfound'});else if(!ok)bad({code:'net',message:e.type})});
    }
  })}};
}

let ac=null,muted=false;
function tone(f1,f2,dur,type,vol,delay){
  if(muted)return;
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(Math.max(f2,30),t0+dur);
    g.gain.setValueAtTime(vol||0.12,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}

  const s=Math.min(vw/W,vh/H)*0.98,w=Math.floor(W*s),h=Math.floor(H*s);
  stage.style.width=w+'px';stage.style.height=h+'px';
  stage.parentElement.style.alignItems=portrait?'flex-start':'center';
  stage.parentElement.style.paddingTop=portrait?'30px':'0';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);scale=cv.width/W;
}
addEventListener('resize',resize);resize();

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function btn(label,action,cls){const b=el('button','btn'+(cls?' '+cls:''),label);b.dataset.a=action;return b}
function setOverlay(nodes){ov.innerHTML='';const p=el('div','panel');for(const n of nodes)if(n)p.appendChild(typeof n==='string'?htmlNode(n):n);ov.appendChild(p);ov.classList.remove('hidden');pauseBtn.style.display='none';controls.classList.remove('show');ov.scrollTop=0}
function htmlNode(s){const d=document.createElement('div');d.innerHTML=s;return d}
function hideOverlay(){ov.classList.add('hidden');pauseBtn.style.display='block';controls.classList.add('show')}
const HELP='<p class="desk">Mover <span class="keys">← →</span> · Saltar/volar <span class="keys">Espacio</span> · Arma <span class="keys">Z</span> · Poder <span class="keys">X</span> · Pausa <span class="keys">P</span></p><p class="mob">◀ ▶ mover · ⤒ saltar/volar · 🗡 arma · ✦ poder</p>';

function titleScreen(){
  state='title';if(!lvl)loadLevel(1);
  const n=[];
  n.push('<h1>🦖 DINO AVENTURA</h1>');
  n.push('<p class="big">100 niveles · 5 mundos · 10 jefes</p>');
  n.push('<p>Montá tu dino, juntá armas y súper poderes, y rescatá los huevos. Si tu dino cae, seguís a pie: encontrá un ❤ para revivirlo.</p>');
  n.push(HELP);
  n.push('<p class="rot">📱 Girá el celular para jugar más grande</p>');
  n.push('<p>🏆 Nivel máximo: '+Math.min(save.max,100)+' · 🥚 '+totalEggs()+' huevos</p>');
  const row=el('div','row');row.appendChild(btn('▶ Jugar','levels'));row.appendChild(btn('🌐 Online','online','alt'));n.push(row);
  if(room)n.push(el('p','tag','En sala '+roomCode.toUpperCase()+' como '+myName));
  setOverlay(n);netPresence();
}
function levelSelect(){
  state='levels';
  const n=[el('h2',null,'Elegí un nivel')];
  n.push(el('p',null,'Completá un nivel para desbloquear el siguiente. 👑 = jefe'));
  const friendLv={};for(const pr of peersList){if(pr.sameTab)continue;const ps=pr.presence||{};if(typeof ps.L==='number')friendLv[ps.L]=(friendLv[ps.L]||[]).concat(cleanName(ps.n))}
  for(let wi=0;wi<5;wi++){
    n.push(el('div','world',(wi+1)+'. '+WORLDS[wi].name));
    const g=el('div','lvgrid');
    for(let i=1;i<=20;i++){const L=wi*20+i,open=L<=save.max||friendLv[L];
      const b=el('button','lv'+(open?'':' locked')+(save.done[L]!=null?' done':'')+(L%10===0?' bossl':''),open?String(L):'🔒');
      if(open)b.dataset.a='play:'+L;
      if(L%10===0&&open)b.textContent=L+'👑';
      if(friendLv[L]){b.classList.add('friend');b.title=friendLv[L].join(', ')}
      g.appendChild(b)}
    n.push(g);
  }
  n.push(btn('← Volver','title','alt'));
  setOverlay(n);netPresence();
}
function startLevel(L,fromCheck){
  if(!fromCheck)checkIdx=-1;
  loadLevel(L,fromCheck);eggs=0;state='play';hideOverlay();netPresence();
}
function levelClear(){
  state='clear';sfx.win();
  carry={weapon:player.weapon,power:player.power==='wing'?null:player.power};
  const L=levelNum;save.done[L]=Math.max(save.done[L]||0,levelEggs);save.max=Math.max(save.max,Math.min(100,L+1));if(L===100)save.won=true;persist();
  netPresence();
  if(L===100){
    setOverlay(['<h1>🏆 ¡CAMPEÓN!</h1>','<p class="big">Derrotaste al Rey T-Rex y completaste los 100 niveles</p>','<p class="big">🥚 '+totalEggs()+' huevos rescatados</p>',btn('Elegir nivel','levels'),btn('Menú','title','alt')]);
    return;
  }
  const nextW=worldOf(L+1)!==worldOf(L);
  setOverlay(['<h2>¡Nivel '+L+' completado!</h2>','<p class="big">🥚 '+levelEggs+' de '+lvl.eggTotal+' huevos</p>',
    nextW?'<p class="big">🌍 ¡Nuevo mundo desbloqueado: '+WORLDS[worldOf(L+1)].name+'!</p>':'',
    (L+1)%10===0?'<p>⚠️ El siguiente es un nivel de jefe</p>':'',
    btn('Siguiente ▶','next'),btn('Niveles','levels','alt')]);
}
function onGameOver(){
  state='over';netPresence();
  setOverlay(['<h2>¡Te atraparon!</h2>','<p class="big">'+(checkIdx>=0?'Volvés al último punto de control':'Volvés al inicio del nivel')+'</p>',btn('Reintentar','retry'),btn('Niveles','levels','alt')]);
}
function pause(){if(state!=='play')return;state='paused';netPresence();
  setOverlay(['<h2>Pausa</h2>',HELP,btn('Continuar','resume'),btn('Reiniciar nivel','relevel','alt'),btn('Niveles','levels','alt'),btn(muted?'🔇 Sonido: no':'🔊 Sonido: sí','mute','alt')])}
function act(a){
  tone(600,600,0.01,'sine',0.001);
  if(a.startsWith('play:')){carry={weapon:null,power:null};startLevel(+a.slice(5));return}
  if(a.startsWith('follow:')){const L=+a.slice(7);carry={weapon:null,power:null};startLevel(L);return}
  switch(a){
    case 'levels':levelSelect();break;
    case 'title':titleScreen();break;
    case 'next':startLevel(levelNum+1);break;
    case 'retry':startLevel(levelNum,true);break;
    case 'relevel':checkIdx=-1;startLevel(levelNum);break;
    case 'resume':state='play';hideOverlay();netPresence();break;
    case 'mute':muted=!muted;state='play';pause();break;
    case 'online':onlineScreen();break;
    case 'create':createRoom();break;
    case 'join':{const i=document.getElementById('codeIn');joinRoom((i&&i.value||'').trim().toLowerCase());break}
    case 'leave':leaveRoom();break;
  }
}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a)});
pauseBtn.addEventListener('click',pause);

/* ================= ONLINE ================= */
let roomNS=null,room=null,roomCode='',peersList=[],netState='loading',netErr='',lastPres='',joining=false;
let myName='',myColor=0;
try{myName=localStorage.getItem('dinoName')||'';myColor=+(localStorage.getItem('dinoColor')||0)%6}catch(e){}
if(!myName)myName='Jugador'+Math.floor(10+Math.random()*90);
const peerView=new Map();
function cleanName(s){s=String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯]/g,'').trim();return (s||'Jugador').slice(0,14)}
let netMode='claude';
async function initNet(){
  try{if(window.claude&&typeof window.claude.use==='function')roomNS=await window.claude.use('room')}catch(e){roomNS=null}
  if(!roomNS&&typeof makeP2P==='function'){
    for(let i=0;i<40&&typeof window.Peer!=='function';i++)await new Promise(r=>setTimeout(r,150));
    roomNS=makeP2P();if(roomNS)netMode='p2p';
  }
  netState=roomNS?'ready':'unavailable';
  refreshOnline(true);
}
setTimeout(initNet,0);
function onlineScreen(){
  state='online';onlineSig=netState+'|'+roomCode+'|'+myName+'|'+myColor+'|'+peersList.filter(p=>!p.sameTab).map(p=>{const s=p.presence||{};return p.peer+':'+cleanName(s.n)+':'+(s.c|0)+':'+s.s+':'+(s.L|0)}).join(',');
  const n=[el('h2',null,'🌐 Jugar online')];
  if(netState==='loading'){n.push(el('p',null,'Conectando…'));n.push(btn('← Volver','title','alt'));setOverlay(n);return}
  if(netState==='unavailable'){n.push(el('p',null,typeof makeP2P==='function'?'No se pudo cargar el modo online. Revisá la conexión a internet y volvé a abrir la página.':'El modo online no está disponible en esta vista. Abrí el juego desde Claude con tu cuenta (y tus amigos invitados a la página) para jugar juntos.'));n.push(btn('← Volver','title','alt'));setOverlay(n);return}
  n.push(el('p',null,'Tu nombre y color:'));
  const inp=el('input','txt');inp.id='nameIn';inp.maxLength=14;inp.value=myName;inp.enterKeyHint='done';inp.autocomplete='off';inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});inp.addEventListener('blur',()=>setTimeout(()=>refreshOnline(),50));inp.addEventListener('input',()=>{myName=cleanName(inp.value);try{localStorage.setItem('dinoName',myName)}catch(e){}netPresence()});n.push(inp);
  const sw=el('div','swatches');for(let i=0;i<6;i++){const s=el('button','sw'+(i===myColor?' on':''));s.style.background=TUNICS[i];s.style.boxShadow='inset 0 -8px 0 '+DINO_SKINS[i][2];s.addEventListener('click',()=>{myColor=i;try{localStorage.setItem('dinoColor',i)}catch(e){}netPresence();onlineScreen()});sw.appendChild(s)}n.push(sw);
  if(!room){
    n.push(btn('✨ Crear sala','create'));
    const r=el('div','row');const ci=el('input','txt code');ci.id='codeIn';ci.maxLength=4;ci.placeholder='CÓDIGO';ci.autocapitalize='characters';r.appendChild(ci);r.appendChild(btn('Unirme','join','alt'));n.push(r);
    if(joining)n.push(el('p',null,'Entrando a la sala…'));
    if(netErr)n.push(el('p','err',netErr));
    n.push(el('p','small',netMode==='p2p'?'Creá una sala y pasales el código a tus amigos (hasta 8 jugadores). Cada uno juega en su celular y se ven en el mismo nivel. La sala sigue abierta mientras quien la creó tenga el juego abierto.':'Creá una sala y pasales el código a tus amigos. Cada uno juega en su celular y se ven en el mismo nivel. Tus amigos tienen que tener acceso a esta página.'));
  }else{
    n.push(el('div','code-big','SALA '+roomCode.toUpperCase()));
    n.push(el('p','small','Pasale este código a tus amigos. Elijan el mismo nivel para jugar juntos.'));
    const list=el('div','plist');
    const others=peersList.filter(p=>!p.sameTab);
    const me=el('div','prow');const dot=el('span','dot');dot.style.background=TUNICS[myColor];me.appendChild(dot);me.appendChild(el('span','pn',myName+' (vos)'));list.appendChild(me);
    for(const pr of others){const ps=pr.presence||{};const row=el('div','prow');const d=el('span','dot');d.style.background=TUNICS[(ps.c|0)%6];row.appendChild(d);
      row.appendChild(el('span','pn',cleanName(ps.n)+(pr.guest?' (invitado)':'')));
      row.appendChild(el('span','pl',ps.s==='play'?'Nivel '+(ps.L|0):'en menú'));
      if(typeof ps.L==='number'&&ps.L>=1&&ps.L<=100){const b=btn('Ir a su nivel','follow:'+(ps.L|0),'mini');row.appendChild(b)}
      list.appendChild(row)}
    if(!others.length)list.appendChild(el('p','small','Esperando amigos…'));
    n.push(list);
    n.push(btn('▶ Elegir nivel','levels'));n.push(btn('Salir de la sala','leave','alt'));
  }
  n.push(btn('← Volver','title','alt'));
  setOverlay(n);
}
let onlineSig='';
function typing(){const a=document.activeElement;return a&&a.tagName==='INPUT'}
function refreshOnline(force){
  if(state!=='online')return;
  const sig=netState+'|'+roomCode+'|'+myName+'|'+myColor+'|'+peersList.filter(p=>!p.sameTab).map(p=>{const s=p.presence||{};return p.peer+':'+cleanName(s.n)+':'+(s.c|0)+':'+s.s+':'+(s.L|0)}).join(',');
  if(!force&&sig===onlineSig)return;
  if(typing()){setTimeout(()=>refreshOnline(force),800);return}
  onlineScreen();
}
function randCode(){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s}
function createRoom(){joinRoom(randCode(),true)}
async function joinRoom(code,host,tries){
  netErr='';
  if(!/^[a-z0-9]{4}$/.test(code)){netErr='El código tiene 4 letras o números';onlineScreen();return}
  if(!roomNS){netErr='Online no disponible';onlineScreen();return}
  joining=true;onlineScreen();
  try{
    if(room){try{await room.leave()}catch(e){}room=null}
    room=await roomNS.join('dino-'+code,!!host);roomCode=code;
    room.onPeers(ch=>{peersList=ch.peers.slice();for(const l of ch.left)peerView.delete(l.peer);refreshOnline()},
      err=>{room=null;peersList=[];roomCode='';netErr=err&&err.code==='closed'?'La sala se cerró (quien la creó salió del juego)':'Se perdió la conexión con la sala';flash(netErr);if(state==='online')onlineScreen()});
    lastPres='';netPresence();
  }catch(e){room=null;const c=e&&e.code;
    if(c==='taken'&&host&&(tries||0)<4){joining=false;return joinRoom(randCode(),true,(tries||0)+1)}
    netErr=c==='not_permitted'?'No tenés permiso para salas online acá':c==='notfound'?'No encontré la sala '+code.toUpperCase()+'. Revisá el código y que quien la creó tenga el juego abierto.':c==='full'?'La sala está llena (máximo 8)':'No se pudo conectar. Revisá internet y probá de nuevo.'}
  joining=false;if(state==='online')onlineScreen();
}
async function leaveRoom(){if(room){try{await room.leave()}catch(e){}}room=null;peersList=[];peerView.clear();roomCode='';onlineScreen()}
function netPresence(){
  if(!room)return;
  const p=player,playing=(state==='play'||state==='paused'||state==='dying')&&p;
  const o=playing?{n:myName,c:myColor,s:'play',L:levelNum,x:Math.round(p.x+p.w/2),y:Math.round(p.y+p.h),f:p.face,m:p.mounted?1:0,
      pw:p.power||'',wp:p.weapon||'',fl:p.flyT>0?1:0,a:p.aim>0?1:0,g:p.onGround?1:0,wk:Math.round(p.walk*10)/10,e:eggs,mx:save.max}
    :{n:myName,c:myColor,s:'menu',L:levelNum,e:eggs,mx:save.max};
  const js=JSON.stringify(o);if(js===lastPres)return;lastPres=js;
  room.presence(o).catch(()=>{});
}
function netTick(){if(room&&frame%3===0)netPresence()}
function drawPeers(){
  if(!room)return;
  for(const pr of peersList){
    if(pr.sameTab)continue;const ps=pr.presence||{};
    if(ps.s!=='play'||ps.L!==levelNum||typeof ps.x!=='number'||typeof ps.y!=='number')continue;
    let v=peerView.get(pr.peer);if(!v){v={x:ps.x,y:ps.y};peerView.set(pr.peer,v)}
    v.x+=(ps.x-v.x)*0.3;v.y+=(ps.y-v.y)*0.3;
    if(v.x<cam.x-80||v.x>cam.x+W+80)continue;
    const c=(ps.c|0)%6,pw=ps.pw==='fire'||ps.pw==='ice'?ps.pw:null,wp=WEAPONS[ps.wp]?ps.wp:null;
    drawRiderUnit({x:v.x,y:v.y,face:ps.f===-1?-1:1,walk:+ps.wk||0,air:!ps.g,mounted:!!ps.m,skin:DINO_SKINS[c],tunic:TUNICS[c],power:pw,flying:!!ps.fl,weapon:wp,aim:ps.a?1:0,blink:false,alpha:0.85});
    txt(cleanName(ps.n),v.x,v.y-(ps.m?66:42),13,'#fff','center');
  }
}
function drawNetHUD(){
  if(!room)return;
  const others=peersList.filter(p=>!p.sameTab);
  const rows=[{n:myName,c:myColor,L:levelNum,e:eggs,me:true}].concat(others.map(p=>{const ps=p.presence||{};return{n:cleanName(ps.n),c:(ps.c|0)%6,L:ps.s==='play'?(ps.L|0):0,e:ps.e|0}})).slice(0,6);
  const h=22+rows.length*17;
  ctx.fillStyle='rgba(0,0,0,.35)';rr(W-196,56,188,h,10);ctx.fill();
  txt('🌐 SALA '+roomCode.toUpperCase(),W-102,73,13,'#ffd23f');
  rows.forEach((r,i)=>{const y=90+i*17;ctx.fillStyle=TUNICS[r.c];ell(W-184,y-4,5,5);ctx.fill();
    txt((r.me?'★ ':'')+r.n,W-174,y,12,r.L===levelNum?'#fff':'#bbb','left');txt(r.L?'Nv'+r.L+' 🥚'+r.e:'menú',W-14,y,12,'#cfe','right')});
}

/* ================= CONTROLES ================= */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='codeIn')act('join');return}
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=true;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.right=true;
  else if(k==='ArrowUp'||k===' '||k==='w'||k==='W'){if(!e.repeat&&!keys.jump)jumpPressed=true;keys.jump=true}
  else if(k==='x'||k==='X'||k==='k'||k==='K'){if(!e.repeat)powerPressed=true}
  else if(k==='z'||k==='Z'||k==='j'||k==='J'||k==='c'||k==='C'){if(!e.repeat)attackPressed=true}
  else if(k==='p'||k==='P'||k==='Escape'){if(state==='play')pause();else if(state==='paused')act('resume')}
  else if(k==='Enter'){const b=ov.querySelector('[data-a]');if(b&&!ov.classList.contains('hidden'))act(b.dataset.a)}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
});
addEventListener('keyup',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.left=false;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.right=false;
  else if(k==='ArrowUp'||k===' '||k==='w'||k==='W')keys.jump=false});
addEventListener('blur',()=>{keys.left=keys.right=keys.jump=false;pause()});
function bindBtn(id,key){
  const b=document.getElementById(id);const ids=new Set();
  const down=e=>{e.preventDefault();ids.add(e.pointerId);try{b.setPointerCapture(e.pointerId)}catch(_){}
    if(key==='jump'&&!keys.jump)jumpPressed=true;if(key==='power')powerPressed=true;if(key==='attack')attackPressed=true;keys[key]=true;b.classList.add('on')};
  const up=e=>{ids.delete(e.pointerId);if(!ids.size){keys[key]=false;b.classList.remove('on')}};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('bL','left');bindBtn('bR','right');bindBtn('bJ','jump');bindBtn('bP','power');bindBtn('bA','attack');
const bP=document.getElementById('bP'),bA=document.getElementById('bA');let uiSig='';
function syncButtons(){if(!player)return;const p=player;const sig=(p.power||'')+'|'+(p.weapon||'')+'|'+p.mounted;if(sig===uiSig)return;uiSig=sig;
  bP.textContent=p.power==='fire'?'🔥':p.power==='ice'?'❄️':'✦';bP.classList.toggle('off',!(p.mounted&&(p.power==='fire'||p.power==='ice')));
  bA.textContent=p.weapon?WEAPONS[p.weapon].icon:'🗡';bA.classList.toggle('off',!p.weapon)}

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(now-last,100);last=now;
  while(acc>=1000/60){update();acc-=1000/60}
  syncButtons();draw();requestAnimationFrame(loop);
}
titleScreen();requestAnimationFrame(loop);

})();
</script>
